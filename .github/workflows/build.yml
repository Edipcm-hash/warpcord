name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Derle
        shell: pwsh
        run: ./gui/build.ps1

      - name: Selftest (saf mantik)
        shell: pwsh
        run: |
          # GUI bir exe: PowerShell onu beklemez, bu yuzden Start-Process -Wait
          $p = Start-Process -FilePath ./dist/WarpCord.exe -ArgumentList '--selftest' -NoNewWindow -Wait -PassThru
          $p.ExitCode | Out-Host
          if ($p.ExitCode -ne 0) { throw "selftest basarisiz: kod $($p.ExitCode)" }

      - name: Smoke (arayuz + motor)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/WarpCord.exe -ArgumentList '--smoke' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke basarisiz: kod $($p.ExitCode)" }

      - name: Imza (opsiyonel, SignPath)
        # Ucretsiz acik kaynak imzalama icin SignPath basvurusu onaylandiktan sonra
        # SIGNPATH_API_TOKEN / SIGNPATH_ORG_ID / SIGNPATH_PROJECT / SIGNPATH_POLICY
        # secret'larini tanimla ve bu adimi ac:
        #   - uses: SignPath/github-action-submit-signing-request@v1
        #     with:
        #       api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        #       organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
        #       project-slug: ${{ secrets.SIGNPATH_PROJECT }}
        #       signing-policy-slug: ${{ secrets.SIGNPATH_POLICY }}
        #       artifact-configuration-slug: exe
        #       wait-for-completion: true
        #       output-artifact-directory: dist-signed
        if: false
        shell: pwsh
        run: Write-Host "SignPath yapilandirilana kadar imza adimi pasif."

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarpCord-exe
          path: dist/WarpCord.exe
          if-no-files-found: error

      - name: Release (yalnizca etikette)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag dist/WarpCord.exe --clobber
